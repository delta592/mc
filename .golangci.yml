version: "2"
run:
  timeout: 10m
  build-tags:
    - kqueue
  tests: true
linters:
  default: none
  enable:
    - gomodguard_v2
    - govet
    - ineffassign
    - misspell
    - revive
    - staticcheck
    - unused
  settings:
    misspell:
      locale: US
    staticcheck:
      checks:
        - all
        # Deprecated APIs are still required for compatibility with older servers.
        - -SA1019
  exclusions:
    generated: lax
    rules:
      - path: (.+)\.go$
        text: instead of using struct literal
      - path: (.+)\.go$
        text: should have a package comment
      - path: (.+)\.go$
        text: error strings should not be capitalized or end with punctuation or a newline
      - path: (.+)\.go$
        text: error strings should not end with punctuation or newlines
      - path: (.+)\.go$
        text: error strings should not be capitalized
    paths:
      - third_party$
      - builtin$
      - examples$
      - pkg/fswatch/
      - pkg/selfupdate/
      - pkg/shlex/
      - pkg/xattr/
      - pkg/colorjson/
formatters:
  enable:
    - gofmt
    - gofumpt
    - goimports
  exclusions:
    generated: lax
    paths:
      - third_party$
      - builtin$
      - examples$
