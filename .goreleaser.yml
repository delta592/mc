# yaml-language-server: $schema=https://goreleaser.com/static/schema.json
version: 2

project_name: mc

release:
  name_template: "Version {{.Version}}"
  disable: true
  github:
    owner: delta592
    name: mc

env:
  - CGO_ENABLED=0

before:
  hooks:
    - make clean
    - go generate ./...
    - go mod tidy
    - go mod download

builds:
  - id: mc
    targets:
      - linux_amd64
      - darwin_amd64
      - darwin_arm64
      - windows_amd64
      - freebsd_amd64
    overrides:
      - goos: darwin
        goarch: amd64
        env:
          - MACOSX_DEPLOYMENT_TARGET=15.0
      - goos: darwin
        goarch: arm64
        env:
          - MACOSX_DEPLOYMENT_TARGET=26.0
    flags:
      - -tags=kqueue
      - -trimpath
    ldflags:
      - "-s -w -X github.com/delta592/mc/cmd.Version={{.Version}} -X github.com/delta592/mc/cmd.ReleaseTag={{.Tag}} -X github.com/delta592/mc/cmd.CommitID={{.FullCommit}} -X github.com/delta592/mc/cmd.ShortCommitID={{.ShortCommit}}"

  - id: mc-cpuv1
    targets:
      - linux_amd64_v1
    flags:
      - -tags=kqueue
      - -trimpath
    ldflags:
      - "-s -w -X github.com/delta592/mc/cmd.Version={{.Version}} -X github.com/delta592/mc/cmd.ReleaseTag={{.Tag}} -X github.com/delta592/mc/cmd.CommitID={{.FullCommit}} -X github.com/delta592/mc/cmd.ShortCommitID={{.ShortCommit}}"

archives:
  - formats:
      - binary
    name_template: "{{ .Binary }}-release/{{ .Os }}-{{ .Arch }}/{{ .Binary }}.{{ .Version }}"

nfpms:
  - id: minio
    package_name: mc
    vendor: MinIO, Inc.
    homepage: https://github.com/delta592/mc
    maintainer: dev@min.io
    description: MinIO Client (mc) provides a modern alternative to UNIX commands like ls, cat, cp, mirror, diff, find etc. It supports filesystems and Amazon S3 compatible cloud storage service (AWS Signature v2 and v4).
    license: Apache 2.0
    bindir: /usr/bin
    formats:
      - deb
      - rpm
    contents:
      - src: NOTICE
        dst: /usr/share/mc/NOTICE
      - src: CREDITS
        dst: /usr/share/mc/CREDITS
      - src: LICENSE
        dst: /usr/share/mc/LICENSE
      - src: README.md
        dst: /usr/share/mc/README.md
    overrides:
      deb:
        file_name_template: "{{ .Binary }}-release/debs/{{ .ProjectName }}-{{ .Version }}_{{ if eq .Arch \"arm\" }}armv7{{ else }}{{ .Arch }}{{ end }}"
      rpm:
        file_name_template: "{{ .Binary }}-release/rpms/{{ .ProjectName }}-{{ .Version }}.{{ if eq .Arch \"amd64\" }}x86_64{{ else if eq .Arch \"arm64\" }}aarch64{{ else if eq .Arch \"arm\" }}armv7{{ else }}{{ .Arch }}{{ end }}"

checksum:
  algorithm: sha256

signs:
  - signature: "${artifact}.asc"
    cmd: sh
    args:
      - -c
      - gpg --quiet --detach-sign -a ${artifact}
    artifacts: all

changelog:
  sort: asc
  filters:
    exclude:
      - '^Update yaml files'

dockers_v2:
  - id: mc
    dockerfile: Dockerfile.release
    ids:
      - mc
    images:
      - delta592/mc
      - quay.io/delta592/mc
    tags:
      - "{{ .Tag }}"
      - latest
    platforms:
      - linux/amd64
    extra_files:
      - LICENSE
      - CREDITS
    annotations:
      org.opencontainers.image.description: "MinIO Client (mc), maintained at https://github.com/delta592/mc"
      org.opencontainers.image.source: "https://github.com/delta592/mc"
      org.opencontainers.image.revision: "{{ .FullCommit }}"
      org.opencontainers.image.version: "{{ .Version }}"

  - id: mc-cpuv1
    dockerfile: Dockerfile.release.old_cpu
    ids:
      - mc-cpuv1
    images:
      - delta592/mc
      - quay.io/delta592/mc
    tags:
      - "{{ .Tag }}-cpuv1"
    platforms:
      - linux/amd64
    extra_files:
      - LICENSE
      - CREDITS
    annotations:
      org.opencontainers.image.description: "MinIO Client (mc) build for older x86-64 CPUs"
      org.opencontainers.image.source: "https://github.com/delta592/mc"
      org.opencontainers.image.revision: "{{ .FullCommit }}"
      org.opencontainers.image.version: "{{ .Version }}"
